name: Release runtime images

on:
  push:
    tags: ["v*"]

jobs:
  build-push:
    if: github.repository == 'matpeltier/hfvast'  # trusted release workflow only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: llama-cpp, file: runtime/llama-cpp/Dockerfile }
          - { name: vllm, file: runtime/vllm/Dockerfile }
          - { name: sglang, file: runtime/sglang/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository }}/hfvast-${{ matrix.name }}:${{ github.ref_name }}
