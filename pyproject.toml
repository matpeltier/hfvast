[project]
name = "hfvast"
version = "0.2.0"
description = "Turn a Hugging Face model into a temporary, OpenAI-compatible GPU endpoint on Vast.ai."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "hfvast contributors" }]
keywords = ["huggingface", "vast-ai", "gguf", "vllm", "llama-cpp", "sglang", "inference", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.16",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
    "huggingface_hub>=0.30",
    "platformdirs>=4.2",
    "tenacity>=8.3",
    "tomli-w>=1.0",
]

[project.scripts]
hfvast = "hfvast.cli:main"

[project.urls]
Homepage = "https://github.com/hfvast/hfvast"
Issues = "https://github.com/hfvast/hfvast/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfvast"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# runtime scripts are standalone stdlib-only files executed on instances (py3.10+)
"src/hfvast/runtime/*" = ["UP031", "SIM115", "SIM105"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108", "RUF001", "RUF002", "RUF003"]  # unicode glyphs in CLI output are intentional

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["huggingface_hub.*", "platformdirs.*", "tenacity.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# standalone stdlib scripts executed on rented instances (tested by execution)
module = ["hfvast.runtime.gateway", "hfvast.runtime.watchdog_container", "hfvast.runtime.downloader_container"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests hitting real external services (opt-in via HFVAST_LIVE=1)",
]
addopts = "-q"
